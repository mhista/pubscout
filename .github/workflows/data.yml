# Keeps the catalog fresh with no manual indexing. Two kinds of run:
#
#  • Nightly (and the "Run workflow" button): refresh pub.dev's top SYNC_LIMIT packages,
#    add the next SYNC_BATCH packages from the ranking (the catalog grows every night until
#    SYNC_MAX), refresh lower-ranked packages on a weekly rotation, plus the pinned ones
#    (essentials, requests, overrides). Write AI summaries for packages that need one
#    (pending ones first), rebuild data/catalog.json, commit. Vercel redeploys.
#  • Package request: someone uses "Request a package" on the site, which opens an issue
#    labelled `package-request`. This run syncs just the requested packages, rebuilds,
#    commits, and closes the issue with a link. Usually live within ~10 minutes.
#
# If AI quota runs out, the build still finishes: those packages show their pub.dev
# description, are marked "summary pending", and the next run summarises them first.
#
# Setup (once): repo → Settings → Secrets and variables → Actions:
#   Secrets:   GEMINI_API_KEY, GROQ_API_KEY, GH_PAT (fine-grained token for GitHub stats)
#   Variables: SITE_URL (e.g. https://pubscout.dev), used in the "Added" comment
name: Refresh package data

on:
  schedule:
    # Cron is UTC. "17 3 * * *" = 03:17 UTC = 04:17 in Lagos (WAT), every day.
    - cron: "17 3 * * *"
  workflow_dispatch: # the "Run workflow" button
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    # Ignore issues that aren't package requests.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'package-request')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REQUEST_RUN: ${{ github.event_name == 'issues' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # data/raw is a rebuildable download cache, kept between runs so only changed packages are re-fetched.
      - name: Restore raw cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Collect package requests
        run: node scripts/requests.mjs pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync pub.dev and GitHub
        run: |
          if [ "$REQUEST_RUN" = "true" ]; then node scripts/sync.mjs --requested; else node scripts/sync.mjs; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          SYNC_LIMIT: 2000   # refreshed every night
          SYNC_GROW: 1       # add a new batch from the ranking each night...
          SYNC_BATCH: 2000   # ...this many...
          SYNC_MAX: 6000     # ...until the catalog covers the top 6,000 (see README before raising)
          SYNC_GH_WAIT: 1    # if GitHub's hourly quota runs out, wait for the reset

      - name: Tag, summarise and score
        run: node scripts/build-catalog.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDERS: gemini,groq
          AI_REFRESH: major
          SYNC_LIMIT: 2000

      - name: Commit if anything changed
        run: |
          git config user.name "pubscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/history.json data/ai data/embeddings.json data/requests.json data/sync-state.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if [ "$REQUEST_RUN" = "true" ]; then MSG="data: add requested packages"; else MSG="data: nightly refresh"; fi
          git commit -m "$MSG"
          git pull --rebase --autostash
          git push

      - name: Close fulfilled requests
        if: always()
        run: node scripts/requests.mjs close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}